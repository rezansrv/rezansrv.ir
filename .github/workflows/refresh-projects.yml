name: Refresh GitHub projects

on:
  schedule:
    # Weekly wake-up; the script only triggers a build on alternate Mondays.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-github-projects
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'rezansrv/rezansrv.ir' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out production code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Request the Cloudflare build when due
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/trigger-projects-refresh.ts
        env:
          CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
