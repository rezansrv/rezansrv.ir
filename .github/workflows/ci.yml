name: CI

on:
  push:
    branches:
      - main
      - develop
      - migration/nuxt4
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Verify generated HTML
        run: npm run test:generated

      - name: Run smoke tests against generated output
        run: npm run test:smoke:generated
