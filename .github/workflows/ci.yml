name: CI

on:
  push:
    branches:
      - main
      - develop
      - migration/nuxt4
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      # Run before ordinary generation so an old local artifact cannot hide a
      # provider-specific output-path regression.
      - name: Generate and verify Cloudflare Pages static output
        env:
          CF_PAGES: '1'
          NITRO_PRESET: cloudflare-pages-static
        run: |
          npm run generate
          npm run test:generated
          node tests/static/verify-cloudflare-output.mjs

      - name: Build
        run: npm run build

      - name: Generate static site
        run: npm run generate

      - name: Verify generated HTML
        run: npm run test:generated

      - name: Run smoke tests against generated output
        run: npm run test:smoke:generated
